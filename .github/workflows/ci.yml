name: Cinema slice checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cinema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm install
      - run: node scripts/test-cinema-contracts.mjs
      - run: npm run typecheck
      - run: npm run build
